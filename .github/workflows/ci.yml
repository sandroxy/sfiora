name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Bridge contract
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: "24"
      - name: Verify bridge contract and wrappers
        run: node --test tests/js/bridge-wrappers.test.mjs
      - name: Verify release metadata
        run: ./scripts/verify-release-metadata.sh
      - name: Verify release policy and scripts
        run: |
          ruby -c scripts/release-policy.rb
          ruby -c scripts/snapshot-release-candidate.rb
          ruby -c scripts/verify-publish-candidate.rb
          bash -n scripts/prepare-release-candidate.sh
          ruby scripts/test-release-policy.rb

  android:
    name: Android
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: native/android
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            native/android/*.gradle
            native/android/gradle.properties
            native/android/gradle/wrapper/gradle-wrapper.properties
            native/android/sfiora/*.gradle
            native/android/sfiora-ui/*.gradle
            adapters/android/*.gradle
            adapters/shared/android/*.gradle
            plugin.json
      - name: Test and assemble
        run: >-
          ./gradlew --no-daemon
          :sfiora:testDebugUnitTest
          :sfiora-ui:testDebugUnitTest
          :sfiora:lintRelease
          :sfiora-ui:lintRelease
          :sfiora:assembleRelease
          :sfiora-ui:assembleRelease
      - name: Verify release artifacts
        run: >-
          ../../scripts/verify-release-metadata.sh &&
          ../../scripts/verify-native-android.sh
      - name: Test shared Android bridge
        run: >-
          ./gradlew -p ../../adapters/android --no-daemon
          :bridge-support:testDebugUnitTest

  apple:
    name: Apple
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Check Swift formatting
        run: >-
          xcrun swift-format lint --strict --recursive
          Package.swift native/ios/Sources tests/ios
          adapters/shared/ios/Sources adapters/shared/ios/Tests
      - name: Test canonical iOS source
        run: ./scripts/test-native-ios-source.sh
      - name: Test shared iOS bridge
        working-directory: adapters/shared/ios
        run: swift test -Xswiftc -warnings-as-errors
      - name: Build for iOS Simulator
        run: >-
          xcodebuild -quiet -scheme Sfiora
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Build for iOS device
        run: >-
          xcodebuild -quiet -scheme Sfiora
          -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO
          SWIFT_TREAT_WARNINGS_AS_ERRORS=YES build
      - name: Verify release artifacts
        run: >-
          ./scripts/verify-release-metadata.sh &&
          ./scripts/verify-native-ios.sh

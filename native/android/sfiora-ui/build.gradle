import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id "com.android.library"
    id "maven-publish"
    id "signing"
}

base {
    archivesName = "sfiora-ui"
}

android {
    namespace = "com.sandrox.sfiora.ui"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles("consumer-rules.pro")
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }
}

dependencies {
    api project(":sfiora")
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

// Robolectric references hidden Android annotations absent from android.jar.
tasks.withType(JavaCompile).matching { it.name.contains("UnitTest") }.configureEach {
    options.compilerArgs.add("-Xlint:-classfile")
}

rootProject.ext.configureSfioraPublication(
        project,
        "Sfiora UI",
        "Managed NFC operation UI for Sfiora on Android"
)

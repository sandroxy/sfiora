import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id "com.android.library"
    id "maven-publish"
    id "signing"
}

base {
    archivesName = "sfiora"
}

android {
    namespace = "com.sandrox.sfiora"
    compileSdk = 36

    defaultConfig {
        minSdk = 21
        consumerProguardFiles("consumer-rules.pro")
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    testOptions {
        unitTests.includeAndroidResources = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        test {
            resources.srcDir(rootProject.file("../../tests/fixtures"))
        }
    }
}

dependencies {
    testImplementation "com.google.code.gson:gson:2.11.0"
    testImplementation "junit:junit:4.13.2"
    testImplementation "org.robolectric:robolectric:4.16.1"
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(["-Xlint:all", "-Werror"])
}

rootProject.ext.configureSfioraPublication(
        project,
        "Sfiora",
        "NFC reading and writing for Android"
)

// Robolectric references hidden Android annotations absent from android.jar.
// Keep source warnings fatal; suppress only missing metadata in test dependencies.
tasks.withType(JavaCompile).matching { it.name.contains("UnitTest") }.configureEach {
    options.compilerArgs.add("-Xlint:-classfile")
}

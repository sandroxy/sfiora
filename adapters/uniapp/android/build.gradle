plugins {
    id "com.android.library"
}

def safeExtGet(String name, Object fallback) {
    rootProject.ext.has(name) ? rootProject.ext.get(name) : fallback
}

def uniAppRuntime = providers.gradleProperty("uniAppAarPath").orNull
        ?: System.getenv("DCLOUD_ANDROID_UNIAPP_AAR")
if (uniAppRuntime == null || !file(uniAppRuntime).isFile()) {
    throw new GradleException(
            "Set -PuniAppAarPath=/absolute/path/to/uniapp-v8-release.aar "
                    + "or DCLOUD_ANDROID_UNIAPP_AAR before building the UniApp adapter."
    )
}

base {
    archivesName = "sfiora-uniapp"
}

android {
    namespace = "com.sandrox.sfiora.uniapp"
    compileSdk = safeExtGet("compileSdkVersion", 36)

    defaultConfig {
        minSdk = safeExtGet("minSdkVersion", 21)
        targetSdk = safeExtGet("targetSdkVersion", 36)
        consumerProguardFiles("consumer-rules.pro")
    }

    buildTypes {
        release {
            minifyEnabled = false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }
}

dependencies {
    compileOnly files(uniAppRuntime)
    compileOnly files(rootProject.ext.requireSfioraCoreAar())
    compileOnly files(rootProject.ext.requireSfioraUiAar())
    compileOnly project(":bridge-support")
}
